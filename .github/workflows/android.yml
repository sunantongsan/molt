name: Build MOLT Alpha 56
on:
  push:
    branches: [play-alpha-56]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare the existing Play package
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          config = Path('app/build.gradle')
          config.write_text(config.read_text().replace("applicationId 'com.sunantongsan.molt'", "applicationId 'com.sunantongsan.ghostmatch3'").replace('versionCode 2', 'versionCode 56').replace("versionName '0.2.0'", "versionName '1.0.0'"))
          web = Path('web')
          files = {p.relative_to(web).as_posix(): hashlib.sha1(p.read_bytes()).hexdigest() for p in web.rglob('*') if p.is_file() and p != web / 'manifest.json'}
          (web / 'manifest.json').write_text(json.dumps({'version': 62, 'files': files}))
          PY
      - run: gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MOLT-56-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
