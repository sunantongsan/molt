name: Build MOLT APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Write game manifest (version + file hashes, used by the patch system)
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          root = 'web'; files = {}
          for d, _, names in os.walk(root):
              for n in names:
                  p = os.path.join(d, n); rel = os.path.relpath(p, root).replace(os.sep, '/')
                  if rel == 'manifest.json': continue
                  files[rel] = hashlib.sha1(open(p, 'rb').read()).hexdigest()
          json.dump({'version': int(os.environ['GITHUB_RUN_NUMBER']), 'files': files}, open(os.path.join(root, 'manifest.json'), 'w'))
          print(len(files), 'files')
          PY
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "molt-${{ github.run_number }}.apk"
      # APK goes to Releases (not Actions artifacts) so it doesn't eat the 500 MB Actions storage.
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" "molt-${{ github.run_number }}.apk" --target "$GITHUB_SHA" --prerelease --title "MOLT build ${{ github.run_number }}" --notes "Test APK — open this on your phone and install."
      - name: Keep only the 3 newest builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag || true; done

  # Publish the game folder to GitHub Pages: installed apps download it as an over-the-air patch.
  # Needs the repo to be public and Settings > Pages > Source = "GitHub Actions".
  patch:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Write game manifest (version + file hashes, used by the patch system)
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          root = 'web'; files = {}
          for d, _, names in os.walk(root):
              for n in names:
                  p = os.path.join(d, n); rel = os.path.relpath(p, root).replace(os.sep, '/')
                  if rel == 'manifest.json': continue
                  files[rel] = hashlib.sha1(open(p, 'rb').read()).hexdigest()
          json.dump({'version': int(os.environ['GITHUB_RUN_NUMBER']), 'files': files}, open(os.path.join(root, 'manifest.json'), 'w'))
          print(len(files), 'files')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
