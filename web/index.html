<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2b7fd6">
<title>MOLT</title>
<style>
  @font-face{font-family:Mitr;font-weight:500;font-display:swap;src:url(fonts/mitr-thai-500-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
  @font-face{font-family:Mitr;font-weight:500;font-display:swap;src:url(fonts/mitr-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
  @font-face{font-family:Mitr;font-weight:600 900;font-display:swap;src:url(fonts/mitr-thai-700-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
  @font-face{font-family:Mitr;font-weight:600 900;font-display:swap;src:url(fonts/mitr-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}

  html,body{margin:0;height:100%;background:#1d5fa8;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
    font-family:Mitr,system-ui,-apple-system,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  .ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg,rgba(10,30,70,.55),rgba(10,30,70,.85));color:#fff;text-align:center;padding:62px 14px 24px;box-sizing:border-box}
  .ui > *{flex-shrink:0}
  .ui > :first-child{margin-top:auto}
  .ui > :last-child{margin-bottom:auto}
  .hidden{display:none!important}
  h1{margin:0;font-size:clamp(40px,13vw,60px);letter-spacing:4px;font-weight:900;color:#ffd84a;text-shadow:0 4px 0 #b06a00,0 8px 18px rgba(0,0,0,.5)}
  h2{margin:0;font-size:40px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.35)}
  .sub{opacity:.9;font-size:15px;margin-top:-6px}
  .btn{border:0;border-radius:18px;padding:16px 36px;font-size:24px;font-weight:900;color:#fff;cursor:pointer;
    background:linear-gradient(#4fd35b,#22a32f);box-shadow:0 6px 0 #157020,0 10px 20px rgba(0,0,0,.35);font-family:inherit}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #157020}
  .ups{display:flex;gap:8px;flex-wrap:nowrap;justify-content:center;width:100%;max-width:420px}
  .up{flex:1 1 0;min-width:0;max-width:130px;border-radius:14px;padding:8px 4px;background:#fff;color:#16335c;box-shadow:0 5px 0 #9fb4d6;cursor:pointer;border:0;font-family:inherit}
  .up b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up .lv{font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up .cost{margin-top:4px;font-weight:900;color:#c77d00;font-size:15px;white-space:nowrap}
  .up.off{opacity:.5}
  .coins{font-size:22px;font-weight:900;color:#ffd84a}
  .big{font-size:56px;font-weight:900;color:#ffd84a}
  .lvls{display:flex;gap:8px;overflow-x:auto;width:100%;max-width:420px;padding:6px 4px 10px;box-sizing:border-box;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .lvls::-webkit-scrollbar{display:none}
  .lvb{flex:0 0 52px;height:52px;scroll-snap-align:center;border-radius:14px;border:0;font:900 20px Mitr,system-ui,sans-serif;color:#fff;background:#3f6fb5;box-shadow:0 4px 0 #23467d;cursor:pointer}
  .lvb.done{background:#2fa84a;box-shadow:0 4px 0 #1b6e2d}
  .lvb.sel{outline:3px solid #ffd84a;outline-offset:2px}
  .lvb.lock{background:#555d6b;box-shadow:0 4px 0 #383e48;opacity:.7}
  .lvb.siege{background:#8a3fb5;box-shadow:0 4px 0 #5a2378}
  .lvname{font-weight:900;font-size:18px;color:#bfe3ff;margin-top:-4px}
  #tdUi .hud{position:fixed;top:10px;left:72px;right:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;z-index:4}
  #tdUi .hud span{background:rgba(0,0,0,.5);color:#fff;border-radius:12px;padding:6px 9px;font:800 13px Mitr,system-ui,sans-serif;white-space:nowrap}
  #tdUi .hud b{color:#ffd84a}
  #tdUi .raid{position:fixed;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:4;pointer-events:none}
  #tdUi .raid .btn{pointer-events:auto;padding:12px 34px;font-size:22px;background:linear-gradient(#ff7a4a,#d8452a);box-shadow:0 6px 0 #8f2a17,0 10px 20px rgba(0,0,0,.35)}
  #tdUi .rsub{color:#fff;font:700 12px Mitr,system-ui,sans-serif;text-shadow:0 1px 3px #000}
  #sheet{position:fixed;left:8px;right:8px;bottom:8px;max-height:58vh;overflow-y:auto;background:#fffaf0;border-radius:20px;padding:12px 12px 14px;z-index:6;box-shadow:0 -6px 24px rgba(0,0,0,.4);color:#2b2216}
  .shead{display:flex;justify-content:space-between;align-items:center;font-size:19px;margin-bottom:8px}
  .shead button{border:0;background:#e9dcc4;border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
  .sinfo{font-size:13px;color:#6b5a40;margin-bottom:8px}
  .sbtn{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:14px;padding:11px 14px;margin:6px 0;background:#4fb35b;color:#fff;font-family:inherit;box-shadow:0 4px 0 #2d7a36;cursor:pointer;text-align:left;gap:8px}
  .sbtn b{font-size:15px}.sbtn small{font-size:12px;opacity:.95;text-align:right}
  .sbtn.off{background:#b8ad9a;box-shadow:0 4px 0 #8c8371}
  #tdUi .raid .btn.small{padding:8px 20px;font-size:15px;background:linear-gradient(#6d8fc9,#3f62a3);box-shadow:0 4px 0 #26406e}
  .roundbtn{position:fixed;left:12px;bottom:26px;z-index:5;width:66px;height:66px;border-radius:20px;border:0;background:linear-gradient(#ffd84a,#f0a400);box-shadow:0 5px 0 #a86a00,0 8px 16px rgba(0,0,0,.35);font-size:28px;line-height:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit}
  .roundbtn small{font:800 11px Mitr,system-ui,sans-serif;color:#5a3a00;margin-top:2px}
  .roundbtn.raidb{left:12px;bottom:104px;background:linear-gradient(#9fb6e8,#5a78c0);box-shadow:0 5px 0 #34508a,0 8px 16px rgba(0,0,0,.35)}
  .roundbtn.raidb small{color:#0e2350}
  .roundbtn.help{left:auto;right:12px;background:linear-gradient(#8fd0ff,#4a9be0);box-shadow:0 5px 0 #2b6aa8,0 8px 16px rgba(0,0,0,.35)}
  .roundbtn.help small{color:#0c3560}
  #tut{position:fixed;inset:0;z-index:30}
  #introUi{position:fixed;inset:0;z-index:25}
  #introSkip{position:absolute;right:12px;top:12px;border:0;border-radius:14px;padding:9px 16px;background:rgba(0,0,0,.55);color:#fff;font:800 15px Mitr,system-ui,sans-serif;cursor:pointer}
  .introHint{position:absolute;left:0;right:0;bottom:54px;text-align:center;color:rgba(255,255,255,.85);font:700 13px Mitr,system-ui,sans-serif;text-shadow:0 1px 3px #000}
  #tutSpot{position:fixed;border-radius:50%;box-shadow:0 0 0 200vmax rgba(0,0,0,.62);transition:all .35s ease;pointer-events:none;border:3px solid #ffd84a}
  #tutHand{position:fixed;font-size:44px;pointer-events:none;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  @keyframes tap{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-4px,-14px) scale(1.08)}}
  #tutBox{position:fixed;left:16px;right:16px;background:#fffaf0;color:#2b2216;border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);font:700 17px/1.45 Mitr,system-ui,sans-serif;white-space:pre-line}
  .tutBtns{display:flex;justify-content:space-between;margin-top:12px}
  .tutBtns button{border:0;border-radius:12px;padding:10px 18px;font:800 15px Mitr,system-ui,sans-serif;cursor:pointer}
  #tutNext{background:#4fb35b;color:#fff;box-shadow:0 4px 0 #2d7a36}
  #tutSkip{background:#e9dcc4;color:#6b5a40}
  #tutDots{text-align:center;margin-top:8px;font-size:10px;letter-spacing:4px;color:#c9b48c}
  #defHint{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:8px 14px;border-radius:12px;font:700 13px Mitr,system-ui,sans-serif;white-space:nowrap;z-index:4;pointer-events:none}
  .wrow{background:#f3e8d3;border-radius:14px;padding:8px 10px;margin:8px 0}
  .wname b{font-size:15px}.wname span{font-size:12px;color:#8a6a3a;margin-left:4px}.wname small{display:block;font-size:11px;color:#6b5a40;margin-top:2px}
  .wbtns{display:flex;gap:6px}.wbtns .sbtn{margin:6px 0 0;padding:8px 10px}
  .btn.ad{background:linear-gradient(#ffcf3a,#f59a00);box-shadow:0 6px 0 #a35f00,0 10px 20px rgba(0,0,0,.35);color:#4a2a00}
  .btn.ad small{display:block;font-size:13px;font-weight:800;opacity:.85}
  .btn.ghost{background:rgba(255,255,255,.15);box-shadow:none;font-size:16px;padding:10px 22px}
  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 16px;border-radius:14px;font:700 14px Mitr,system-ui,sans-serif;z-index:9;max-width:86vw;text-align:center}
  #mute{position:fixed;left:8px;top:8px;z-index:5;width:56px;height:56px;border-radius:50%;border:3px solid #fff3c4;background:#f7832a url(img/avatar.png) center/cover;box-shadow:0 3px 0 #a8460c,0 6px 12px rgba(0,0,0,.3);cursor:pointer;padding:0}
  #mute i{position:absolute;right:-6px;bottom:-4px;font-style:normal;font-size:14px;background:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  #starRow{position:fixed;left:6px;top:66px;z-index:5;width:62px;display:flex;justify-content:center;gap:0;font-size:17px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
  #starRow span{transition:transform .25s}
  #starRow span.off{filter:grayscale(1) brightness(.75);opacity:.75}
  #starRow span.pop{transform:scale(1.5)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="ui">
  <h1>MOLT</h1>
  <div class="sub">เลือกเส้นทาง • สร้างกองทัพ • บุกปราสาทศัตรู</div>
  <div class="coins">🪙 <span id="mCoins">0</span></div>
  <div class="lvls" id="lvls"></div>
  <div class="ups" id="ups"></div>
  <div class="lvname" id="mName"></div>
  <button class="btn" id="play">เล่นด่าน <span id="mLevel">1</span></button>
  <div class="sub" style="font-size:13px;margin-top:4px">ลากนิ้วซ้าย-ขวาเพื่อบังคับ</div>
  <button class="btn ghost" id="homeBtn">🦆 กลับบ้านเป็ด</button>
</div>

<button id="mute" aria-label="sound"></button>
<div id="tdUi" class="hidden">
  <div id="starRow"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <div class="hud">
    <span>📅 วันที่ <b id="tdWave">1</b></span><span>🪙 <b id="tdCoins">0</b></span>
  </div>
  <div class="raid">
    <button class="btn" id="waveBtn">▶ เริ่มวันที่ 1</button>
  </div>
  <button id="houseBtn" class="roundbtn">🏠<small>บ้าน</small></button>
  <button id="raidBtn" class="roundbtn raidb">⚔️<small>บุกแมว</small></button>
  <button id="helpBtn" class="roundbtn help">❓<small>วิธีเล่น</small></button>
</div>
<div id="sheet" class="hidden">
  <div class="shead"><b id="sheetTitle"></b><button id="sheetClose">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="toast" class="hidden"></div>
<div id="introUi" class="hidden"><button id="introSkip">ข้าม ▶▶</button><div class="introHint">แตะเพื่อไปต่อ</div></div>
<div id="tut" class="hidden">
  <div id="tutSpot"></div>
  <div id="tutHand">👆</div>
  <div id="tutBox"><div id="tutText"></div><div class="tutBtns"><button id="tutSkip">ข้าม</button><button id="tutNext">ต่อไป ▶</button></div><div id="tutDots"></div></div>
</div>
<div id="result" class="ui hidden">
  <h2 id="rTitle">ชนะ!</h2>
  <div id="rInfo" class="sub"></div>
  <div class="big">+<span id="rCoins">0</span> 🪙</div>
  <button class="btn ad" id="adBtn">🎬 ดูโฆษณา รับ x3</button>
  <button class="btn" id="next">🦆 กลับบ้านเป็ด</button>
</div>
<div id="adFake" class="ui hidden">
  <div class="sub" style="font-size:13px;opacity:.7">โฆษณา (ตัวอย่าง — ในแอปจะเป็นโฆษณาจริง)</div>
  <div style="font-size:64px">🦆📺</div>
  <div class="big" id="adCount">5</div>
  <button class="btn ghost" id="adClose" disabled>ปิด</button>
</div>

<script>
"use strict";
// ---------- Save ----------
const SAVE_KEY = 'molt_toplords_v1';
const save = { level: 1, coins: 0, army: 0, archery: 0, income: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const UPGRADES = [
  { key: 'army',    name: 'ทหารเริ่มต้น', desc: lv => `เริ่ม ${1 + lv * 2} คน`, cost: lv => Math.round(40 * Math.pow(1.35, lv)) },
  { key: 'archery', name: 'ธนูไว',        desc: lv => `ยิงเร็ว x${(1 + lv * 0.15).toFixed(2)}`, cost: lv => Math.round(60 * Math.pow(1.4, lv)) },
  { key: 'income',  name: 'รายได้',       desc: lv => `เหรียญ x${(1 + lv * 0.2).toFixed(1)}`, cost: lv => Math.round(80 * Math.pow(1.45, lv)) },
];

// ---------- Sound (synthesised, no files) ----------
const SFX = (() => {
  let ac = null, master = null, muted = false, noiseBuf = null;
  try { muted = localStorage.getItem('molt_mute') === '1'; } catch (e) {}
  const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      loadBank();
    } catch (e) { ac = null; }
  }
  function tone(type, f0, f1, dur, vol, delay) {
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, q, delay) {
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = ac.currentTime + (delay || 0);
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = freq; fl.Q.value = q || 1;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(fl); fl.connect(g); g.connect(master); src.start(t); src.stop(t + dur + 0.02);
  }
  // wobbly "voice" for cat cries: a saw/triangle pair bent by an LFO, through a soft filter
  function cry(f0, f1, dur, vol, delay, wob) {
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
    const lfo = ac.createOscillator(), lg = ac.createGain();
    o.type = 'sawtooth'; o2.type = 'triangle';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    o2.frequency.setValueAtTime(f0 * 2.01, t); o2.frequency.exponentialRampToValueAtTime(f1 * 2.01, t + dur);
    lfo.frequency.value = wob || 9; lg.gain.value = f0 * 0.06;
    lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    fl.type = 'bandpass'; fl.frequency.value = 1400; fl.Q.value = 1.2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(fl); o2.connect(fl); fl.connect(g); g.connect(master);
    [o, o2, lfo].forEach(x => { x.start(t); x.stop(t + dur + 0.05); });
  }
  const defs = {
    shoot: () => { noise(0.07, 0.12, 2800, 2); tone('triangle', 950, 420, 0.06, 0.04); },
    hit: () => { noise(0.09, 0.28, 900, 1.5); tone('square', 230, 90, 0.07, 0.05); },
    meow: () => { tone('sawtooth', 650, 1100, 0.09, 0.035); tone('sawtooth', 1100, 480, 0.14, 0.035, 0.09); },
    wood: () => { noise(0.1, 0.35, 520, 3); tone('sine', 170, 80, 0.09, 0.14); },
    break: () => { noise(0.4, 0.5, 350, 0.8); tone('sine', 120, 40, 0.3, 0.3); },
    plus: () => tone('sine', 880, 1400, 0.09, 0.1),
    gateGood: () => [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, 0, 0.16, 0.12, i * 0.06)),
    gateBad: () => { tone('sawtooth', 320, 110, 0.35, 0.1); noise(0.3, 0.15, 300, 1); },
    clash: () => { noise(0.07, 0.25, 3200, 5); tone('square', 1500, 900, 0.05, 0.035); },
    quack: () => { tone('sawtooth', 520, 300, 0.1, 0.05); tone('square', 480, 260, 0.08, 0.02); },
    win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('triangle', f, 0, 0.28, 0.14, i * 0.12)),
    lose: () => [392, 330, 262, 196].forEach((f, i) => tone('triangle', f, 0, 0.32, 0.14, i * 0.18)),
    click: () => tone('sine', 600, 900, 0.06, 0.1),
    // cat soldier knocked out: "mee-yaaow~" falling off, plus a little armour clatter
    catDie: () => { const p = 0.85 + Math.random() * 0.35; cry(620 * p, 980 * p, 0.12, 0.09, 0, 7); cry(980 * p, 330 * p, 0.42, 0.08, 0.11, 11); noise(0.12, 0.12, 2400, 3, 0.18); },
    catHurt: () => { const p = 0.9 + Math.random() * 0.3; cry(900 * p, 1300 * p, 0.09, 0.05, 0, 14); },
    bossStep: () => { tone('sine', 70, 38, 0.22, 0.32); noise(0.12, 0.12, 180, 1); },
    slam: () => { tone('sine', 110, 30, 0.55, 0.5); noise(0.5, 0.55, 260, 0.7); noise(0.25, 0.3, 1800, 2, 0.04); },
    bossRoar: () => { cry(260, 420, 0.25, 0.14, 0, 6); cry(420, 160, 0.7, 0.14, 0.22, 5); noise(0.5, 0.15, 500, 0.8, 0.1); },
    bossDie: () => { cry(400, 520, 0.2, 0.14, 0, 5); cry(520, 90, 1.1, 0.14, 0.18, 4); tone('sine', 90, 30, 0.6, 0.4, 0.9); noise(0.5, 0.4, 300, 0.8, 0.9); },
    coin: () => { const p = 1 + Math.random() * 0.15; tone('square', 1320 * p, 0, 0.06, 0.04); tone('square', 1760 * p, 0, 0.12, 0.04, 0.05); },
    xbow: () => { noise(0.05, 0.25, 1600, 4); tone('square', 300, 120, 0.06, 0.05); },
    cannon: () => { tone('sine', 140, 40, 0.4, 0.45); noise(0.35, 0.5, 600, 0.8); noise(0.15, 0.25, 3000, 1, 0.02); },
    fire: () => { noise(0.25, 0.18, 900, 0.6); tone('sawtooth', 200, 90, 0.2, 0.03); },
    poof: () => noise(0.18, 0.12, 700, 0.9),
    crack: () => { noise(0.08, 0.4, 1200, 3); noise(0.3, 0.3, 400, 1, 0.05); tone('square', 160, 60, 0.15, 0.06); },

      for (let k = 0; k < n; k++) objs.push({ t: 'tile', x, z: z + k * 1.15, w: 1.5, hp: 1, alive: true });
      // a barrier guarding the other side makes the choice interesting
      if (Math.random() < 0.6) objs.push({ t: 'barrier', x: -x, z: z + 1, w: 2.6, hp: rint(3, 4 + lvl * 2), max: 0, alive: true });
      z += n * 1.15 + 8;
    } else if (kind === 'barrier') {
      const x = pick([-1.5, 0, 1.5]);
      const hp = rint(5, 8 + lvl * 3);
      objs.push({ t: 'barrier', x, z, w: 2.8, hp, max: hp, alive: true });
      z += 10;
    } else {
      const n = rint(4 + lvl * 2, 8 + lvl * 4);
      objs.push({ t: 'squad', x: rnd(-1.4, 1.4), z, n, alive: true, fight: false });
      z += 12;
    }
  }
  for (const o of objs) if (o.t === 'barrier' && !o.max) o.max = o.hp;
  finishZ = z + 6;
  const boss = Math.round(90 + (lv0 - 10) * 20);
  objs.push({ t: 'army', x: 0, z: finishZ, n: boss, alive: true, fight: false });
  objs.push({ t: 'castle', z: finishZ + 9 });
}

function startLevel() {
  SFX.init();
  SFX.play('click');
  level = sel;
  army = 1 + save.army * 2 + (typeof armyBonus === 'function' ? armyBonus() : 0);
  px = 0; pz = 0; speed = 8.5; camZ = pz - CAM_BACK;
  arrows = []; parts = []; floats = []; enemyShots = []; dying = []; fx = [];
  runT = 0; fireAcc = 0; shake = 0; battle = null; endTimer = 0; earned = 0; killed = 0;
  buildLevel(level);
  state = 'play';
  hide('menu'); hide('result');
}

// ---------- Input ----------
let dragging = false, lastX = 0;
const keys = {};
cv.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
window.addEventListener('pointermove', e => {
  if (!dragging || state !== 'play') return;
  const unit = Math.min(W, H * 0.6) / 6.4;
  px += (e.clientX - lastX) / unit * 1.25;
  lastX = e.clientX;
  px = Math.max(-ROAD + 0.4, Math.min(ROAD - 0.4, px));
});
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointercancel', () => dragging = false);
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// ---------- Helpers ----------
function crowdRadius(n) { return Math.min(2.6, 0.3 + Math.sqrt(Math.min(n, 400)) * 0.17); }
function addFloat(text, x, z, color, small) { floats.push({ text, x, z, y: 0, life: 1, color, small }); if (floats.length > 70) floats.shift(); }
function burst(x, z, color, n) {
  for (let i = 0; i < n; i++) parts.push({ x, z, y: 0.3, vx: rnd(-2, 2), vz: rnd(-1, 3), vy: rnd(2, 5), life: rnd(0.4, 0.8), color });
}
function hitFx(type, x, z, y, color) {
  fx.push({ type, x, z, y: y || 0.5, t: 0, color });
  if (fx.length > 120) fx.splice(0, fx.length - 120);
}
function die(team, cx, cz, count, radius) {
  if (count > 0) SFX.play(team === 'duck' ? 'quack' : (Math.random() < 0.3 ? 'meow' : 'hit'));
  const n = Math.min(count, 10);
  for (let i = 0; i < n; i++) dying.push({ team, x: cx + rnd(-radius, radius), z: cz + rnd(-radius, radius) * 0.6, t: 0, flip: Math.random() < 0.5 });
  if (dying.length > 80) dying.splice(0, dying.length - 80);
}
function applyGate(g) {
  const before = army;
  if (g.op === '+') army += g.v;
  else if (g.op === '-') army -= g.v;
  else if (g.op === 'x') army *= g.v;
  else if (g.op === '÷') army = Math.ceil(army / g.v);
  army = Math.max(0, Math.round(army));
  const d = army - before;
  addFloat((d >= 0 ? '+' : '') + d, px, pz + 1, d >= 0 ? '#7dff8a' : '#ff6a6a');
  SFX.play(d >= 0 ? 'gateGood' : 'gateBad');
  hitFx('ring', px, pz, 0.2, d >= 0 ? '#7fd0ff' : '#ff6a6a');
  if (d < 0) { shake = 0.25; die('duck', px, pz, -d, crowdRadius(before)); }
}

// ---------- Update ----------
function update(dt) {
  if (state === 'play' || state === 'ending') {
    if (keys.ArrowLeft || keys.a) px -= 6 * dt;
    if (keys.ArrowRight || keys.d) px += 6 * dt;
    px = Math.max(-ROAD + 0.4, Math.min(ROAD - 0.4, px));
  }
  if (state === 'play') {
    runT += dt;
    const stopped = battle !== null;
    if (!stopped) pz += speed * (siege ? 0.5 : 1) * dt;
    if (siege) for (const o of objs) {
      if (!o.alive || o.fight) continue;
      if (o.t === 'foe') {
        const Rr = crowdRadius(army), front = pz + Rr * 0.7 + 0.35;
        if (o.st === 'atk') {
          // stick to the front of the duck army and swing the sword
          o.z = Math.max(front, o.z - 3 * dt);
          o.x += Math.sign(px - o.x) * Math.min(Math.max(0, Math.abs(px - o.x) - Rr * 0.8), 1.5 * dt);
          o.atkT += dt;
          if (o.atkT >= 0.75) {
            o.atkT = 0;
            if (army > 0) { army -= 1; die('duck', o.x, o.z - 0.6, 1, 0.2); }
            hitFx('slash', o.x, o.z - 0.4, 0.6, '#ffffff'); SFX.play('clash'); shake = Math.max(shake, 0.08);
            o.hp -= 1;   // the ducks hit back in melee
            if (o.hp <= 0) { o.alive = false; killed++; die('cat', o.x, o.z, 1, 0); }
          }
        } else {
          o.z -= o.v * dt;
          if (o.z - pz < 9) o.x += Math.sign(px - o.x) * Math.min(Math.abs(px - o.x), 0.9 * dt);
          if (o.z <= front && Math.abs(o.x - px) < Rr + 0.35) { o.st = 'atk'; o.atkT = 0.3; }
          else if (o.z < pz - 1.5) o.alive = false;
        }
      } else if (o.t === 'boss' && o.z - pz < 30) {
        o.z -= 1.4 * dt;
        o.x += Math.sign(px - o.x) * Math.min(Math.abs(px - o.x), 0.6 * dt);
      }
    }
    camZ += ((pz - CAM_BACK) - camZ) * Math.min(1, dt * 6);

    // shooting: more soldiers → more arrows
    const rate = (2.2 + Math.min(army, 300) * 0.22) * (1 + save.archery * 0.15);
    fireAcc += dt * Math.min(rate, 45);
    const R = crowdRadius(army);
    while (fireAcc >= 1) {
      fireAcc -= 1;
      if (army <= 0) break;
      const ox = rnd(-R, R) * 0.8;
      arrows.push({ x: px + ox, z: pz + 0.2, z0: pz + 0.2, life: 1.3 });
      SFX.play('shoot');
    }
    if (arrows.length > 160) arrows.splice(0, arrows.length - 160);

    // arrows
    for (const a of arrows) {
      const prevZ = a.z;
      a.z += 26 * dt; a.life -= dt;
      for (const o of objs) {
        if (!o.alive) continue;
        if (o.t === 'tile' || o.t === 'barrier') {
          if (Math.abs(a.x - o.x) < o.w / 2 && prevZ <= o.z && a.z >= o.z - 0.3) {
            a.life = 0;
            o.hp--;
            if (o.t === 'tile') {
              if (o.hp <= 0) { o.alive = false; army += 1; addFloat('+1', o.x, o.z, '#7dff8a'); burst(o.x, o.z, '#4aa3ff', 8); hitFx('ring', o.x, o.z, 0.4, '#7fd0ff'); hitFx('spark', o.x, o.z, 0.5, '#ffffff'); SFX.play('plus'); }
            } else {
              burst(a.x, o.z, '#b07a3e', 3); o.hitT = 0.12;
              hitFx('spark', a.x, o.z, 0.7, '#ffe2a8'); SFX.play('wood');
              if (o.hp <= 0) { o.alive = false; burst(o.x, o.z, '#8a5a2b', 26); hitFx('ring', o.x, o.z, 0.3, '#ffd59a'); shake = Math.max(shake, 0.2); SFX.play('break'); }
            }
            break;
          }
        } else if (o.t === 'foe') {
          if (Math.abs(a.x - o.x) < 0.38 && a.z >= o.z - 0.35 && prevZ < o.z + 0.35) {
            const dmg = 1 + Math.floor(save.archery / 4);
            a.life = 0; o.hp -= dmg; o.hitT = 0.1;
            addFloat('-' + dmg, o.x, o.z - 0.2, '#ffffff', true);
            hitFx('spark', a.x, o.z, 0.5, '#fff3b0');
            if (o.hp <= 0) { o.alive = false; killed++; die('cat', o.x, o.z, 1, 0); burst(o.x, o.z, '#ff5a4f', 5); }
            else SFX.play('hit');
            break;
          }
        } else if (o.t === 'boss') {
          if (Math.abs(a.x - o.x) < 1.4 && a.z >= o.z - 0.9 && prevZ < o.z + 1) {
            a.life = 0; o.hp -= 1; o.hitT = 0.1;
            hitFx('spark', a.x, o.z - 0.5, 1.6 + Math.random(), '#fff3b0'); SFX.play('hit');
            if (o.hp <= 0) { o.alive = false; bossDown(o); }
            break;
          }
        } else if ((o.t === 'squad' || o.t === 'army') && o.n > 0) {
          const r = crowdRadius(o.n);
          if (Math.abs(a.x - o.x) < r + 0.2 && a.z >= o.z - r * 0.6 && prevZ < o.z + r) {
            a.life = 0; o.n--; killed++; die('cat', a.x, o.z - r * 0.4, 1, 0.2);
            burst(a.x, o.z - r * 0.5, '#ff5a4f', 4); hitFx('spark', a.x, o.z - r * 0.4, 0.6, '#fff3b0'); hitFx('ring', a.x, o.z - r * 0.4, 0.1, '#ff7a6a');
            if (o.n <= 0) o.alive = false;
            break;
          }
        }
      }
    }
    arrows = arrows.filter(a => a.life > 0);

    // collisions with crowd
    for (const o of objs) {
      if (!o.alive && o.t !== 'gate') continue;
      if (o.t === 'gate' && !o.used && pz >= o.z) {
        o.used = true;
        applyGate(px < 0 ? o.L : o.R);
      } else if (o.t === 'tile' && Math.abs(pz - o.z) < 0.5 && Math.abs(px - o.x) < o.w / 2 + R * 0.6) {
        o.alive = false; army += 1; addFloat('+1', o.x, o.z, '#7dff8a'); SFX.play('plus'); hitFx('ring', o.x, o.z, 0.4, '#7fd0ff');
      } else if (o.t === 'barrier' && pz >= o.z - 0.4 && pz < o.z + 0.6 && Math.abs(px - o.x) < o.w / 2 + R * 0.7) {
        const loss = Math.min(army, o.hp);
        army -= loss; o.alive = false; shake = 0.35; die('duck', px, pz, loss, R);
        addFloat('-' + loss, px, pz + 1, '#ff6a6a');
        burst(o.x, o.z, '#8a5a2b', 26); SFX.play('break');
      } else if (o.t === 'boss' && !o.fight && pz >= o.z - 2.2 - R) {
        o.fight = true; battle = { o, t: 0 };
      } else if ((o.t === 'squad' || o.t === 'army') && o.n > 0 && !o.fight) {
        const r = crowdRadius(o.n);
        const reach = o.t === 'army' ? r + R : r + R * 0.8;
        if (pz >= o.z - reach && (o.t === 'army' || Math.abs(px - o.x) < r + R)) {
          o.fight = true; battle = { o, t: 0 };
        }
      }
    }

    // melee: both sides trade soldiers over a short time
    if (battle && battle.o.t === 'boss') {
      // the boss smashes ducks; every duck in reach hacks at it
      const o = battle.o;
      const before = battle.t % 1.1;
      battle.t += dt;
      const ph = battle.t % 1.1;
      // ducks in reach keep stabbing the boss
      o.hp -= Math.min(army, 40) * 0.25 * dt;
      if (before < 0.72 && ph >= 0.72) {
        // SLAM: shockwave in front of the boss
        const k = Math.min(army, Math.max(3, Math.round(army * 0.1)));
        army -= k; o.hitT = 0.12;
        const iz = o.z - 1.6;
        die('duck', o.x, iz, k, 1.2); shake = 0.6; SFX.play('break'); SFX.play('gateBad');
        hitFx('ring', o.x, iz, 0.05, '#ffd59a'); hitFx('ring', o.x, iz, 0.05, '#ff7a4a'); hitFx('spark', o.x, iz, 0.4, '#ffffff');
        for (let i = 0; i < 18; i++) parts.push({ x: o.x + rnd(-1.2, 1.2), z: iz + rnd(-0.6, 0.6), y: 0.1, vx: rnd(-3, 3), vz: rnd(-2, 2), vy: rnd(3, 6), life: rnd(0.4, 0.8), color: pick(['#b9a27a', '#8a7a5a', '#e3d7bd']) });
        addFloat('-' + k, px, pz + 1, '#ff6a6a');
      }
      if (o.hp <= 0) { o.alive = false; battle = null; bossDown(o); }
      else if (army <= 0) battle = null;
    } else if (battle) {
      const o = battle.o;
      battle.t += dt;
      const tick = Math.max(1, Math.round(Math.min(army, o.n) * dt * 4));
      const k = Math.min(tick, army, o.n);
      army -= k; o.n -= k; killed += k;
      die('duck', px, pz + crowdRadius(army) * 0.5, k, crowdRadius(army)); die('cat', o.x, o.z - crowdRadius(o.n) * 0.5, k, crowdRadius(o.n));
      if (Math.random() < 0.6) burst(o.x + rnd(-1, 1), o.z - 0.5, Math.random() < 0.5 ? '#e23b3b' : '#3f8bff', 2);
      shake = 0.12; SFX.play('clash');
      if (Math.random() < 0.5) hitFx('spark', o.x + rnd(-1, 1), o.z - crowdRadius(o.n), 0.6, '#ffffff');
      if (Math.random() < 0.35) hitFx('slash', px + rnd(-1, 1), pz + crowdRadius(army) * 0.6, 0.6, '#ffffff');
      if (o.n <= 0) { o.alive = false; battle = null; }
      else if (army <= 0) battle = null;
    }

    if (army <= 0 && state === 'play') lose();
    else if (state === 'play' && pz >= finishZ + 7) win();
  } else if (state === 'ending') {
    endTimer += dt;
    if (won && !siege) pz = Math.min(pz + 3 * dt, finishZ + 8.2);
    camZ += ((pz - CAM_BACK) - camZ) * Math.min(1, dt * 4);
    if (endTimer > 1.6) showResult();
  }

  for (const p of parts) { p.x += p.vx * dt; p.z += p.vz * dt; p.y += p.vy * dt; p.vy -= 12 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0 && p.y > -0.2);
  if (parts.length > 300) parts.splice(0, parts.length - 300);
  for (const e of fx) e.t += dt;
  fx = fx.filter(e => e.t < 0.45);
  for (const o of objs) if (o.hitT > 0) o.hitT -= dt;
  for (const d of dying) d.t += dt;
  dying = dying.filter(d => d.t < 0.9);
  for (const f of floats) { f.y += dt * 1.6; f.life -= dt * 0.9; }
  floats = floats.filter(f => f.life > 0);
  shake = Math.max(0, shake - dt);
}

let won = false;
function bossDown(o) {
  for (let i = 0; i < 50; i++) burst(o.x + rnd(-1.5, 1.5), o.z, pick(['#ffd84a', '#ff5a4f', '#ffffff']), 1);
  hitFx('ring', o.x, o.z, 0.2, '#ffd84a'); hitFx('spark', o.x, o.z, 1.5, '#ffffff');
  shake = 0.5;
  if (state === 'play') win();
}
function win() {
  SFX.play('win');
  won = true; state = 'ending'; endTimer = 0;
  const mult = 1 + save.income * 0.2;
  earned = Math.round((20 + level * 8 + army * 2) * mult);
  for (let i = 0; i < 40; i++) burst(rnd(-2, 2), finishZ + 9, pick(['#ffd84a', '#7dff8a', '#4aa3ff']), 1);
}
function progress() { return siege ? Math.min(1, pz / Math.max(1, bossZ0 - 6)) : Math.min(1, pz / finishZ); }
function lose() {
  SFX.play('lose');
  won = false; state = 'ending'; endTimer = 0;
  const mult = 1 + save.income * 0.2;
  const prog = progress();
  earned = Math.round((5 + prog * (10 + level * 4) + killed * 0.3) * mult);
}
function showResult() {
  state = 'result';
  save.coins += earned;
  const loot = '';
  if (won && level >= save.level) save.level = level + 1;
  if (won) sel = level + 1;
  persist();
  document.getElementById('rTitle').textContent = won ? 'ชนะ! 🏰' : 'กองทัพแตก!';
  document.getElementById('rTitle').style.color = won ? '#ffd84a' : '#ff7a7a';
  document.getElementById('rInfo').textContent = won
    ? `ด่าน ${level} ผ่าน • เหลือทหาร ${army} คน`
    : `ไปได้ ${Math.round(progress() * 100)}% • ล้มศัตรู ${killed}`;
  document.getElementById('rInfo').textContent += loot;
  document.getElementById('rCoins').textContent = earned;
  document.getElementById('next').textContent = '🦆 กลับบ้านเป็ด';
  document.getElementById('next').onclick = () => { hide('result'); enterTD(); };
  const ab = document.getElementById('adBtn');
  ab.classList.toggle('hidden', earned <= 0);
  ab.innerHTML = `🎬 ดูโฆษณา รับ x3<small>+🪙${earned * 2} เพิ่ม</small>`;
  ab.onclick = () => Ads.show(ok => {
    if (!ok) return;
    save.coins += earned * 2; persist(); SFX.play('reward');
    document.getElementById('rCoins').textContent = earned * 3; ab.classList.add('hidden');
  });
  show('result');
}

// ---------- Draw ----------
const SKY = ['#7cc6ff', '#bfe6ff'];
function drawBackground() {
  const th = THEMES[levelInfo(level).theme];
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.17);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.17);
  if (th.stars) {
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (let i = 0; i < 40; i++) ctx.fillRect((i * 97.3) % W, (i * 53.7) % (H * 0.15), 1.5, 1.5);
  }
  // sea
  const s = ctx.createLinearGradient(0, H * 0.155, 0, H);
  s.addColorStop(0, th.sea[0]); s.addColorStop(1, th.sea[1]);
  ctx.fillStyle = s; ctx.fillRect(0, H * 0.155, W, H);
  // waves
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
  const t = performance.now() / 1000;
  for (let i = 0; i < 18; i++) {
    const z = Math.floor(camZ / 4) * 4 + i * 4 + 2;
    const p = proj(0, z); if (p.y < H * 0.2) continue;
    const off = ((i * 37) % 7) - 3;
    for (const side of [-1, 1]) {
      const q = proj(side * (ROAD + 2.5 + (i % 3)) + off * 0.2 + Math.sin(t + i) * 0.3, z);
      ctx.beginPath(); ctx.moveTo(q.x - q.s * 0.5, q.y); ctx.lineTo(q.x + q.s * 0.5, q.y); ctx.stroke();
    }
  }
}

function quad(x1, z1, x2, z2, color) {
  const a = proj(x1, z1), b = proj(x2, z1), c = proj(x2, z2), d = proj(x1, z2);
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.fill();
}

function drawRoad() {
  const near = camZ + 0.2, far = Math.min(camZ + 70, finishZ + 9.6);
  // walls
  quad(-ROAD - 0.7, near, -ROAD, far, '#cdbf9e');
  quad(ROAD, near, ROAD + 0.7, far, '#cdbf9e');
  quad(-ROAD, near, ROAD, far, '#e3d7bd');
  if (ready(IMG.floor)) {
    // perspective floor drawn as thin screen rows (texture = 6x6 world units)
    const T = IMG.floor, TW = 6, TH = T.naturalHeight, ROW = 3;
    const yFar = Math.max(0, proj(0, far).y);
    for (let y = Math.floor(yFar); y < H; y += ROW) {
      const s = (y + ROW / 2 - H * 0.09) / (H * 0.6);
      if (s <= 0) continue;
      const z = camZ + FOCAL / s - 5;
      const l = proj(-ROAD, z), r = proj(ROAD, z);
      const v = (((-z % TW) + TW) % TW) / TW * TH;
      ctx.drawImage(T, 0, Math.min(TH - 1, v), T.naturalWidth, 1, l.x, y, r.x - l.x, ROW + 0.5);
    }
  }
  const shade = THEMES[levelInfo(level).theme].shade;
  if (shade) quad(-ROAD, near, ROAD, far, `rgba(20,10,50,${shade})`);
  quad(-ROAD - 0.7, near, -ROAD, far, '#cdbf9e');
  quad(ROAD, near, ROAD + 0.7, far, '#cdbf9e');
  if (shade) { quad(-ROAD - 0.7, near, -ROAD, far, `rgba(20,10,50,${shade})`); quad(ROAD, near, ROAD + 0.7, far, `rgba(20,10,50,${shade})`); }
  const step = 1.6;
  for (let z = Math.floor(near / step) * step; z < far; z += step) {
    const k = Math.round(z / step);
    // crenellations
    if (k % 2 === 0) {
      for (const sx of [-ROAD - 0.7, ROAD]) {
        const p1 = proj(sx, z), p2 = proj(sx + 0.7, z);
        const h = p1.s * 0.5;
        ctx.fillStyle = '#b9aa86'; ctx.fillRect(p1.x, p1.y - h, p2.x - p1.x, h);
      }
    }
  }
}

function soldier(x, z, color, dark, phase) {
  const p = proj(x, z);
  if (p.y > H + 40 || p.s < 2) return;
  const sz = p.s * 0.3;
  const bob = Math.abs(Math.sin(phase)) * sz * 0.25;
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, sz * 0.8, sz * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = dark;
  ctx.fillRect(p.x - sz * 0.55, p.y - sz * 1.6 - bob, sz * 1.1, sz * 1.3);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(p.x, p.y - sz * 1.9 - bob, sz * 0.55, 0, Math.PI * 2); ctx.fill();
}

function unit(team, x, z, frame, mode) {
  const p = proj(x, z);
  if (p.y > H + 60 || p.s < 2) return;
  const h = p.s * 0.95;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, h * 0.24, h * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  if (team === 'duck') drawFrame(mode === 'shoot' ? 'duck_shoot' : 'duck_run', frame, p.x, p.y, h);
  else if (mode === 'atk') drawFrame('cat', 2 + (frame % 3), p.x, p.y + h * 0.04 * (frame % 3), h);
  else drawFrame('cat', [0, 1, 5, 1][frame % 4], p.x, p.y - Math.abs(Math.sin(frame * 0.8)) * h * 0.06, h);
}
function drawCrowd(cx, cz, n, color, dark, facing, fighting) {
  const team = facing < 0 ? 'duck' : 'cat';
  if (team === 'duck' ? !ready(IMG.duck_run) || !ready(IMG.duck_shoot) : !ready(IMG.cat)) return drawCrowdBasic(cx, cz, n, color, dark, facing);
  const shown = Math.min(n, 140);
  const t = performance.now() / 1000;
  const mode = team === 'duck' ? (battle || state !== 'play' ? 'shoot' : 'run') : (fighting ? 'atk' : 'run');
  const pts = [];
  for (let i = 0; i < shown; i++) {
    const r = 0.23 * Math.sqrt(i + 0.5) * (n > 140 ? Math.sqrt(n / 140) * 0.9 : 1);
    const a = i * 2.39996;
    pts.push([cx + Math.cos(a) * r, cz + Math.sin(a) * r * 0.8 * facing, i]);
  }
  pts.sort((a, b) => b[1] - a[1]);
  const fps = team === 'duck' ? 12 : (fighting ? 10 : 6);
  for (const q of pts) unit(team, Math.max(-ROAD + 0.1, Math.min(ROAD - 0.1, q[0])), q[1], Math.floor(t * fps + q[2] * 1.7), mode);
}
function drawCrowdBasic(cx, cz, n, color, dark, facing) {
  const shown = Math.min(n, 140);
  const t = performance.now() / 110;
  const pts = [];
  for (let i = 0; i < shown; i++) {
    const r = 0.2 * Math.sqrt(i + 0.5) * (n > 140 ? Math.sqrt(n / 140) * 0.9 : 1);
    const a = i * 2.39996;
    pts.push([cx + Math.cos(a) * r, cz + Math.sin(a) * r * 0.8 * facing, i]);
  }
  pts.sort((a, b) => b[1] - a[1]);
  for (const q of pts) soldier(Math.max(-ROAD + 0.1, Math.min(ROAD - 0.1, q[0])), q[1], color, dark, t + q[2]);
}

function label(x, z, text, bg, fg, scale) {
  const p = proj(x, z);
  const fs = Math.max(12, Math.min(34, p.s * 0.42 * (scale || 1)));
  ctx.font = `900 ${fs}px Mitr,system-ui,sans-serif`;
  const w = ctx.measureText(text).width + fs * 0.8;
  ctx.fillStyle = bg;
  roundRect(p.x - w / 2, p.y - fs * 1.15, w, fs * 1.3, fs * 0.35); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, p.x, p.y - fs * 0.5);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function box(x, z, w, d, h, top, front, text, fg) {
  const a = proj(x - w / 2, z), b = proj(x + w / 2, z);
  const c = proj(x - w / 2, z + d), e = proj(x + w / 2, z + d);
  const hh = a.s * h, hb = c.s * h;
  ctx.fillStyle = top; ctx.beginPath();
  ctx.moveTo(a.x, a.y - hh); ctx.lineTo(b.x, b.y - hh); ctx.lineTo(e.x, e.y - hb); ctx.lineTo(c.x, c.y - hb); ctx.closePath(); ctx.fill();
  ctx.fillStyle = front; ctx.fillRect(a.x, a.y - hh, b.x - a.x, hh);
  if (text) {
    const fs = Math.max(10, (b.x - a.x) * 0.38);
    ctx.font = `900 ${fs}px Mitr,system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = fs * 0.15; ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.strokeText(text, (a.x + b.x) / 2, a.y - hh / 2); ctx.fillStyle = fg || '#fff';
    ctx.fillText(text, (a.x + b.x) / 2, a.y - hh / 2);
  }
}

function drawGate(o) {
  const sides = [[-ROAD, 0, o.L], [0, ROAD, o.R]];
  for (const [x1, x2, g] of sides) {
    const good = g.op === '+' || g.op === 'x';
    const a = proj(x1 + 0.08, o.z), b = proj(x2 - 0.08, o.z);
    const h = a.s * 1.8;
    const gi = good ? IMG.gate_blue : IMG.gate_red;
    ctx.globalAlpha = o.used ? 0.12 : 0.38;
    ctx.fillStyle = good ? '#2f8cff' : '#ff4a4a';
    ctx.fillRect(a.x + (b.x - a.x) * 0.12, a.y - h, (b.x - a.x) * 0.76, h);
    ctx.globalAlpha = o.used ? 0.35 : 1;
    if (ready(gi)) drawAt(gi, (a.x + b.x) / 2, a.y + a.s * 0.25, (b.x - a.x) * 1.08);
    else {
      ctx.fillStyle = good ? '#1a5fc2' : '#b72020';
      ctx.fillRect(a.x - 2, a.y - h, 4, h); ctx.fillRect(b.x - 2, b.y - h, 4, h);
      ctx.fillRect(a.x, a.y - h - 4, b.x - a.x, 6);
    }
    ctx.globalAlpha = 1;
    if (!o.used) {
      const fs = Math.max(12, (b.x - a.x) * 0.3);
      ctx.font = `900 ${fs}px Mitr,system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = fs * 0.14; ctx.strokeStyle = 'rgba(0,0,0,.35)';
      const txt = (g.op === '÷' ? '÷' : g.op) + g.v;
      ctx.strokeText(txt, (a.x + b.x) / 2, a.y - h / 2); ctx.fillStyle = '#fff'; ctx.fillText(txt, (a.x + b.x) / 2, a.y - h / 2);
    }
  }
}

function drawFoe(o) {
  if (!ready(IMG.cat)) return;
  const p = proj(o.x, o.z), h = p.s * 0.95;
  if (p.s < 2) return;
  const t = performance.now() / 1000;
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, h * 0.24, h * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  let x = p.x, y = p.y;
  if (o.hitT > 0) x += Math.sin(o.hitT * 120) * h * 0.05;
  if (o.st === 'atk') {
    const k = o.atkT / 0.75;                       // 0..1 swing cycle
    const fr = k < 0.55 ? 2 : k < 0.75 ? 3 : 4;      // raise, swing, follow-through
    y += (k > 0.55 && k < 0.8 ? h * 0.08 : 0);       // lunge toward the ducks
    drawFrame('cat', fr, x, y, h * (k > 0.55 && k < 0.8 ? 1.08 : 1));
  } else {
    const ph = t * 9 + o.ph;
    drawFrame('cat', [0, 1, 5, 1][Math.floor(ph) % 4], x + Math.sin(ph * 0.5) * h * 0.04, y - Math.abs(Math.sin(ph * 0.8)) * h * 0.07, h);
  }
  if (o.hitT > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.25; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y - h * 0.5, h * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  if (o.hp < o.max) {
    const bw = h * 0.6;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x - bw / 2, y - h * 1.08, bw, Math.max(3, h * 0.06));
    ctx.fillStyle = '#ff4a3a'; ctx.fillRect(x - bw / 2, y - h * 1.08, bw * o.hp / o.max, Math.max(3, h * 0.06));
  }
}
function drawBoss(o) {
  const p = proj(o.x, o.z);
  const h = p.s * 3.2;
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, h * 0.32, h * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  const shakeX = o.hitT > 0 ? Math.sin(o.hitT * 120) * h * 0.02 : 0;
  const t = performance.now() / 1000;
  if (ready(IMG.boss)) {
    // waddle while walking, wind up and slam while fighting
    ctx.save(); ctx.translate(p.x + shakeX, p.y);
    let lift = Math.abs(Math.sin(t * 6)) * -h * 0.03;
    if (o.fight && battle && battle.o === o) {
      const ph = battle.t % 1.1;
      if (ph < 0.6) { const k = ph / 0.6; ctx.rotate(-0.3 * k); ctx.scale(1 - 0.05 * k, 1 + 0.08 * k); lift = -h * 0.12 * k; }   // wind-up: lean back, rise
      else if (ph < 0.8) { const k = (ph - 0.6) / 0.2; ctx.rotate(-0.3 + 0.65 * k); ctx.scale(1 + 0.1 * k, 1 - 0.12 * k); lift = -h * 0.12 * (1 - k); }   // slam down
      else { const k = (ph - 0.8) / 0.3; ctx.rotate(0.35 * (1 - k)); ctx.scale(1 + 0.1 * (1 - k), 1 - 0.12 * (1 - k)); lift = 0; }   // recover
    } else ctx.rotate(Math.sin(t * 6) * 0.06);
    drawAt(IMG.boss, 0, lift, h * IMG.boss.naturalWidth / IMG.boss.naturalHeight);
    ctx.restore();
  }
  else if (ready(IMG.cat)) {
    // placeholder until a boss sprite exists: a giant cat with a red aura
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(p.x, p.y - h * 0.5, 0, p.x, p.y - h * 0.5, h * 0.7);
    g.addColorStop(0, 'rgba(255,60,30,.35)'); g.addColorStop(1, 'rgba(255,60,30,0)');
    ctx.fillStyle = g; ctx.fillRect(p.x - h, p.y - h * 1.3, h * 2, h * 1.5); ctx.restore();
    drawFrame('cat', Math.floor(t * 6), p.x + shakeX, p.y, h);
  }
  if (o.hitT > 0) { ctx.save(); ctx.globalAlpha = 0.18; ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y - h * 0.5, h * 0.35, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  // HP bar
  const bw = Math.max(80, h * 0.9), by = p.y - h * 1.08;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(p.x - bw / 2, by, bw, 12, 6); ctx.fill();
  ctx.fillStyle = '#ff4a3a'; roundRect(p.x - bw / 2 + 2, by + 2, (bw - 4) * Math.max(0, o.hp / o.max), 8, 4); ctx.fill();
  ctx.font = '900 13px Mitr,system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#fff';
  ctx.fillText('บอส ' + Math.max(0, Math.ceil(o.hp)), p.x, by - 2);
}
function drawCastle(o) {
  if (ready(IMG.castle)) { const p = proj(0, o.z); drawAt(IMG.castle, p.x, p.y + p.s * 0.6, p.s * (ROAD * 2 + 3)); return; }
  const a = proj(-ROAD - 0.7, o.z), b = proj(ROAD + 0.7, o.z);
  const h = a.s * 4;
  ctx.fillStyle = '#9a8a6a'; ctx.fillRect(a.x, a.y - h, b.x - a.x, h);
  const tw = (b.x - a.x) / 9;
  for (let i = 0; i < 9; i += 2) { ctx.fillStyle = '#8a7a5a'; ctx.fillRect(a.x + i * tw, a.y - h - tw * 0.7, tw, tw * 0.7); }
  const m = proj(0, o.z);
  ctx.fillStyle = '#5a3a1e';
  ctx.beginPath(); const gw = a.s * 1.6, gh = a.s * 2.4;
  ctx.moveTo(m.x - gw / 2, m.y); ctx.lineTo(m.x - gw / 2, m.y - gh + gw / 2);
  ctx.arc(m.x, m.y - gh + gw / 2, gw / 2, Math.PI, 0); ctx.lineTo(m.x + gw / 2, m.y); ctx.fill();
  ctx.fillStyle = '#e23b3b';
  ctx.fillRect(m.x - 1, m.y - h - a.s * 2, 3, a.s * 1.6);
  ctx.beginPath(); ctx.moveTo(m.x + 2, m.y - h - a.s * 2); ctx.lineTo(m.x + a.s * 1.1, m.y - h - a.s * 1.7); ctx.lineTo(m.x + 2, m.y - h - a.s * 1.4); ctx.fill();
}

function draw() {
  const sx = shake > 0 ? rnd(-4, 4) * shake * 4 : 0, sy = shake > 0 ? rnd(-4, 4) * shake * 4 : 0;
  ctx.save(); ctx.translate(sx, sy);
  drawBackground();
  drawRoad();

  // collect drawables back-to-front
  const list = [];
  for (const o of objs) {
    if (o.z < camZ + 0.5 || o.z > camZ + 70) continue;
    if (o.t === 'gate') { if (!o.used) list.push([o.z, () => drawGate(o)]); }
    else if (o.t === 'castle') list.push([o.z + 0.5, () => drawCastle(o)]);
    else if (!o.alive) continue;
    else if (o.t === 'tile') list.push([o.z, () => {
      if (!ready(IMG.plus1)) return box(o.x, o.z, o.w, 1.0, 0.5, '#5fb2ff', '#2f7fe0', '+1');
      const p = proj(o.x, o.z + 0.5); drawAt(IMG.plus1, p.x, p.y + p.s * 0.15, p.s * 1.05);
    }]);
    else if (o.t === 'barrier') list.push([o.z, () => {
      if (!ready(IMG.barrier)) return box(o.x, o.z, o.w, 0.6, 1.0, '#b98a52', '#8a5a2b', String(o.hp));
      const p = proj(o.x, o.z + 0.3); const w = p.s * o.w * 1.05;
      if (o.hitT > 0) p.x += Math.sin(o.hitT * 90) * p.s * 0.06;
      const h = drawAt(IMG.barrier, p.x, p.y + p.s * 0.1, w);
      const fs = Math.max(12, w * 0.17);
      ctx.font = `900 ${fs}px Mitr,system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = fs * 0.16; ctx.strokeStyle = 'rgba(60,30,0,.85)';
      const ty = p.y + p.s * 0.1 - h * 0.6, tx = p.x + w * 0.02;
      ctx.strokeText(String(o.hp), tx, ty); ctx.fillStyle = '#fff'; ctx.fillText(String(o.hp), tx, ty);
    }]);
    else if (o.t === 'boss') list.push([o.z, () => drawBoss(o)]);
    else if (o.t === 'foe') list.push([o.z, () => drawFoe(o)]);
    else if (o.t === 'squad' || o.t === 'army') list.push([o.z + 0.3, () => {
      drawCrowd(o.x, o.z, o.n, '#ff5a4f', '#c22a2a', 1, o.fight && battle && battle.o === o);
      label(o.x, o.z - crowdRadius(o.n) - 0.4, String(o.n), '#c22a2a', '#fff', o.t === 'army' ? 1.3 : 1);
    }]);
  }
  for (const d of dying) list.push([d.z, () => {
    const p = proj(d.x, d.z); const h = p.s * 0.95;
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, d.t - 0.5) / 0.4);
    if (d.team === 'duck' && ready(IMG.duck_die)) drawFrame('duck_die', Math.min(2, Math.floor(d.t * 7)), p.x, p.y, h, d.flip);
    else if (d.team === 'cat' && ready(IMG.cat)) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate((d.flip ? 1 : -1) * Math.min(1.4, d.t * 5));
      drawFrame('cat', 0, 0, 0, h); ctx.restore();
    }
    ctx.globalAlpha = 1;
  }]);
  for (const a of arrows) list.push([a.z, () => {
    // arrow flies in a small arc and leaves a glowing trail
    const k = Math.min(1, (a.z - a.z0) / 18);
    const hgt = 0.55 + Math.sin(k * Math.PI) * 0.6;
    const tail = proj(a.x, a.z - 1.4), p = proj(a.x, a.z), q = proj(a.x, a.z + 0.55);
    const ty = tail.y - tail.s * (hgt - 0.05), py = p.y - p.s * hgt, qy = q.y - q.s * hgt;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(tail.x, ty, p.x, py);
    g.addColorStop(0, 'rgba(255,220,90,0)'); g.addColorStop(1, 'rgba(255,230,120,.75)');
    ctx.strokeStyle = g; ctx.lineWidth = Math.max(2, p.s * 0.09); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tail.x, ty); ctx.lineTo(p.x, py); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = '#7a4a1e'; ctx.lineWidth = Math.max(1.5, p.s * 0.035);
    ctx.beginPath(); ctx.moveTo(p.x, py); ctx.lineTo(q.x, qy); ctx.stroke();
    ctx.fillStyle = '#e8eef5';
    const hs = Math.max(2, q.s * 0.07);
    ctx.beginPath(); ctx.moveTo(q.x, qy - hs * 1.6); ctx.lineTo(q.x - hs, qy + hs * 0.4); ctx.lineTo(q.x + hs, qy + hs * 0.4); ctx.closePath(); ctx.fill();
  }]);
  for (const e of fx) list.push([e.z - 0.01, () => {
    const p = proj(e.x, e.z), k = e.t / 0.45;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.max(0, 1 - k);
    if (e.type === 'slash') {
      const cy = p.y - p.s * e.y, r = p.s * 0.55;
      ctx.strokeStyle = e.color; ctx.lineWidth = Math.max(2, p.s * 0.09 * (1 - k)); ctx.lineCap = 'round';
      const a0 = -2.6 + (e.x * 7 % 1), sweep = 0.4 + k * 1.8;
      ctx.beginPath(); ctx.arc(p.x, cy, r, a0, a0 + sweep); ctx.stroke();
    } else if (e.type === 'ring') {
      ctx.strokeStyle = e.color; ctx.lineWidth = Math.max(2, p.s * 0.08 * (1 - k));
      ctx.beginPath(); ctx.ellipse(p.x, p.y - p.s * e.y * 0.3, p.s * (0.2 + k * 1.1), p.s * (0.08 + k * 0.4), 0, 0, Math.PI * 2); ctx.stroke();
    } else {
      const cy = p.y - p.s * e.y, r = p.s * (0.15 + k * 0.45);
      const g = ctx.createRadialGradient(p.x, cy, 0, p.x, cy, r);
      g.addColorStop(0, e.color); g.addColorStop(0.4, 'rgba(255,200,80,.6)'); g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, p.s * 0.03);
      for (let i = 0; i < 4; i++) {
        const an = i * Math.PI / 2 + e.x * 3;
        ctx.beginPath(); ctx.moveTo(p.x + Math.cos(an) * r * 0.3, cy + Math.sin(an) * r * 0.3); ctx.lineTo(p.x + Math.cos(an) * r * 1.1, cy + Math.sin(an) * r * 1.1); ctx.stroke();
      }
    }
    ctx.restore();
  }]);
  if (army > 0) list.push([pz, () => {
    drawCrowd(px, pz, army, '#5ab0ff', '#2a5fc4', -1);
    label(px, pz - crowdRadius(army) - 0.3, String(army), '#2a5fc4', '#fff', 1.2);
  }]);
  for (const p of parts) list.push([p.z, () => {
    const q = proj(p.x, p.z); ctx.fillStyle = p.color;
    const s = Math.max(2, q.s * 0.08); ctx.fillRect(q.x - s / 2, q.y - p.y * q.s - s / 2, s, s);
  }]);
  list.sort((a, b) => b[0] - a[0]);
  for (const d of list) d[1]();

  for (const f of floats) {
    const p = proj(f.x, f.z);
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = `900 ${f.small ? Math.max(12, p.s * 0.3) : Math.max(18, p.s * 0.5)}px Mitr,system-ui,sans-serif`; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.4)';
    ctx.strokeText(f.text, p.x, p.y - p.s * (1.2 + f.y)); ctx.fillStyle = f.color; ctx.fillText(f.text, p.x, p.y - p.s * (1.2 + f.y));
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // HUD
  if (state === 'play' || state === 'ending') {
    const top = 14 + (window.visualViewport ? 0 : 0);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; roundRect(W / 2 - 110, top, 220, 14, 7); ctx.fill();
    ctx.fillStyle = '#ffd84a'; roundRect(W / 2 - 108, top + 2, 216 * progress(), 10, 5); ctx.fill();
    ctx.font = '900 18px Mitr,system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff'; ctx.fillText('ด่าน ' + level + ' • ' + levelInfo(level).name, W / 2, top + 20);
    ctx.textAlign = 'right'; ctx.fillStyle = '#ffd84a'; ctx.fillText('🪙 ' + save.coins, W - 14, top);
    if (siege && runT < 3) {
      ctx.globalAlpha = Math.min(1, (3 - runT) / 0.8);
      ctx.font = '900 26px Mitr,system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(80,0,0,.7)';
      ctx.strokeText('แมวบุกเข้ามาแล้ว!', W / 2, H * 0.3); ctx.fillStyle = '#ff6a5a'; ctx.fillText('แมวบุกเข้ามาแล้ว!', W / 2, H * 0.3);
      ctx.globalAlpha = 1;
    }
  }
}

// ---------- Menu ----------
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function renderMenu() {
  document.getElementById('mCoins').textContent = save.coins;
  document.getElementById('mLevel').textContent = sel;
  document.getElementById('mName').textContent = levelInfo(sel).name + (typeof raidFood === 'function' ? ` • ใช้ 🍗${raidFood(sel)}` : '');
  const lb = document.getElementById('lvls'); lb.innerHTML = '';
  const cnt = Math.max(10, save.level + 4);
  for (let i = 1; i <= cnt; i++) {
    const b = document.createElement('button');
    const lock = i > save.level;
    b.className = 'lvb' + (i < save.level ? ' done' : '') + (i >= SIEGE_FROM && !lock && i >= save.level ? ' siege' : '') + (lock ? ' lock' : '') + (i === sel ? ' sel' : '');
    b.textContent = lock ? '🔒' : i;
    b.onclick = () => { if (lock) return; SFX.init(); SFX.play('click'); sel = i; renderMenu(); preview(); };
    lb.appendChild(b);
    if (i === sel) requestAnimationFrame(() => { try { b.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} });
  }
  const box = document.getElementById('ups'); box.innerHTML = '';
  for (const u of UPGRADES) {
    const lv = save[u.key], cost = u.cost(lv);
    const b = document.createElement('button');
    b.className = 'up' + (save.coins < cost ? ' off' : '');
    b.innerHTML = `<b>${u.name}</b><div class="lv">Lv.${lv + 1} • ${u.desc(lv)}</div><div class="cost">🪙 ${cost}</div>`;
    b.onclick = () => { if (save.coins >= cost) { save.coins -= cost; save[u.key]++; persist(); renderMenu(); } };
    box.appendChild(b);
  }
}
document.getElementById('play').onclick = startLevel;
const muteBtn = document.getElementById('mute');
muteBtn.innerHTML = SFX.muted ? '<i>🔇</i>' : '';
muteBtn.onclick = e => { e.stopPropagation(); SFX.init(); const m = SFX.toggle(); muteBtn.innerHTML = m ? '<i>🔇</i>' : ''; if (window.toast) toast(m ? '🔇 ปิดเสียงแล้ว' : '🔊 เปิดเสียงแล้ว'); };
document.getElementById('next').onclick = () => { hide('result'); enterTD(); };

function preview() {
  level = sel; army = 1 + save.army * 2; px = 0; pz = 0; camZ = -CAM_BACK;
  arrows = []; parts = []; floats = []; fx = []; dying = []; battle = null; buildLevel(level);
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'intro') { introUpdate(dt); introDraw(); }
  else if (state === 'td' || state === 'tdresult') { if (!window.tutPause) tdUpdate(dt); tdDraw(); }

  else { if (state === 'play' || state === 'ending') update(dt); draw(); }
  requestAnimationFrame(frame);
}
renderMenu(); preview();
requestAnimationFrame(frame);
window.addEventListener('pagehide', () => persist());
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });

// test hook
window.__molt = { get state() { return state; }, get army() { return army; }, get pz() { return pz; }, get finishZ() { return finishZ; }, get objs() { return objs; }, get px() { return px; }, set px(v) { px = v; }, set sel(v) { sel = v; }, startLevel, save, LEVELS };
</script>
